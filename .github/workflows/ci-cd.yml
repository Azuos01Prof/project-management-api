name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Test and Lint
  test:
    name: Test and Lint (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: |
        npx eslint . --ext .js --max-warnings=0 || echo "Linter warnings found but continuing"
    
    - name: Run tests
      run: npm test
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret_key' }}
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY || 'test_api_key' }}
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-node-${{ matrix.node-version }}
        path: coverage/
        retention-days: 7
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          test-results.xml
          junit.xml
        retention-days: 7
  
  # Job 2: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate || true
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
    
    - name: Run OSV Scanner
      uses: google/osv-scanner-action@v1.9.0
      with:
        scan-args: |-
          --lockfile=./package-lock.json
      continue-on-error: true
  
  # Job 3: Build and Package
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --production
    
    - name: Create build artifact
      run: |
        mkdir -p dist
        cp -r node_modules dist/
        cp server.js dist/
        cp package.json dist/
        cp package-lock.json dist/
        echo "Node version: $(node --version)" > dist/version.txt
        echo "Build date: $(date)" >> dist/version.txt
    
    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: dist/
        retention-days: 7
        compression-level: 6
  
  # Job 4: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-artifact
        path: ./build
    
    - name: Deploy to Staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Build size: $(du -sh ./build)"
        echo "Node version: $(cat ./build/version.txt)"
        # Add your deployment commands here
        # Example: rsync -avz --delete ./build/ user@staging-server:/var/www/api/
        # Example: ssh user@staging-server 'pm2 restart project-management-api'
    
    - name: Run smoke tests
      run: |
        echo "🔍 Running smoke tests on staging..."
        # Add your smoke test commands here
        # Example: curl -f https://staging.yourdomain.com/health
        # Example: npm run test:smoke
    
    - name: Notify deployment
      if: always()
      run: |
        echo "✅ Staging deployment completed: ${{ job.status }}"
        # Add Slack/Discord/Teams notification here
  
  # Job 5: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://api.yourdomain.com
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-artifact
        path: ./build
    
    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Build size: $(du -sh ./build)"
        echo "Node version: $(cat ./build/version.txt)"
        # Add your production deployment commands here
        # Example: rsync -avz --delete ./build/ user@prod-server:/var/www/api/
        # Example: ssh user@prod-server 'pm2 restart project-management-api'
    
    - name: Health check
      run: |
        echo "🏥 Running health checks..."
        sleep 5
        # Add health check command
        # Example: curl -f https://api.yourdomain.com/health
    
    - name: Create deployment status
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: ${{ github.event.deployment.id || 0 }},
            state: 'success',
            environment: 'production'
          })
    
    - name: Notify deployment success
      run: |
        echo "✅ Production deployment completed successfully!"
        # Add Slack/Discord/Teams notification here
