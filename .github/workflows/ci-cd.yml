name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  # Job 1: Test and Lint
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: |
        npm install -g eslint
        npx eslint . --ext .js --max-warnings=0 || true
    
    - name: Run tests
      run: npm test
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage/
  
  # Job 2: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
  
  # Job 3: Build and Package
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --production
    
    - name: Create build artifact
      run: |
        mkdir -p dist
        cp -r node_modules dist/
        cp server.js dist/
        cp package.json dist/
        cp package-lock.json dist/
    
    - name: Archive build
      uses: actions/upload-artifact@v3
      with:
        name: build-artifact
        path: dist/
        retention-days: 7
  
  # Job 4: Deploy to Staging (Optional)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact
        path: ./build
    
    - name: Deploy to Staging Server
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Example: rsync -avz ./build/ user@staging-server:/var/www/api/
        # Example: ssh user@staging-server 'pm2 restart project-management-api'
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add your smoke test commands here
        # Example: curl -f https://staging.yourdomain.com/health
  
  # Job 5: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://api.yourdomain.com
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact
        path: ./build
    
    - name: Deploy to Production Server
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: rsync -avz ./build/ user@prod-server:/var/www/api/
        # Example: ssh user@prod-server 'pm2 restart project-management-api'
    
    - name: Health check
      run: |
        echo "Waiting for service to start..."
        sleep 10
        # Add health check command
        # Example: curl -f https://api.yourdomain.com/health
    
    - name: Notify deployment success
      run: |
        echo "✅ Deployment to production completed successfully!"
        # Add notification commands (Slack, Teams, etc.)
